<script type="module">
// Formato 2 (lista + demonstração): título fixo, lista que se preenche à esquerda, janela à direita com o MESMO mascote
// trocando de estilo a cada corte; no fim, grade 2x5 com os 10 estilos + COMENTA PALAVRA. Tudo desenhado aqui (sem overlay do compor).
import * as THREE from "./three.module.min.js";
const CFG = await (await fetch("cfg.json")).json();
const SEG = CFG.timeline.segmentos, CHAVE = (CFG.chave || "ESTILO").toUpperCase();
const NOMES = ["Argila", "Pixel art", "Giz na lousa", "Neon", "Blocos de montar", "Papel recortado", "Lápis", "Desenho animado", "Holograma", "Ouro"];
await document.fonts.load("700 60px SG"); await document.fonts.load("500 30px IN");

const C = document.getElementById("c"), X = C.getContext("2d");
const WW = 560, WH = 1180;                                  // janela de demonstração
const gl = document.createElement("canvas"); gl.width = WW; gl.height = WH;
const R = new THREE.WebGLRenderer({ canvas: gl, antialias: true, preserveDrawingBuffer: true, alpha: true });
R.setClearColor(0x000000, 0); R.setPixelRatio(1); R.outputColorSpace = THREE.SRGBColorSpace; R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
const S = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(52, WW / WH, .1, 60);
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lin = (t, a, b) => cl((t - a) / (b - a)), eo = x => 1 - Math.pow(1 - cl(x), 3);

// ---------- luzes ----------
const hemi = new THREE.HemisphereLight(0xffffff, 0x8a7a70, 1.2); S.add(hemi);
const key = new THREE.DirectionalLight(0xffffff, 2.2); key.position.set(3, 7, 5); key.castShadow = true; key.shadow.mapSize.set(1024, 1024);
Object.assign(key.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); S.add(key);
const rimL = new THREE.PointLight(0xffffff, 0, 12); rimL.position.set(-3, 3, -2); S.add(rimL);
const spec = new THREE.PointLight(0xfff2c0, 0, 10); spec.position.set(2, 3.5, 3); S.add(spec);

// ---------- mascote (mesmo de sempre: bloco largo, olhos verticais, bracinhos, perninhas) ----------

}
const partes = [];                                         // {m, papel:'corpo'|'olho'|'chao'|'bola'|'pino'}
function peca(geo, papel, par, x, y, z) { const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial()); m.position.set(x, y, z); m.castShadow = m.receiveShadow = true; par.add(m);

peca(new THREE.BoxGeometry(.5, .5, .5), "cubo", S, 1.15, .25, -.8); const cubo2 = peca(new THREE.BoxGeometry(.36, .36, .36), "cubo", S, 1.15, .68, -.8); cubo2.rotation.y = .5;

for (let gx = -1.4; gx <= 1.41; gx += .35) for (let gz = -1.4; gz <= 1.41; gz += .35) if (gx * gx + gz * gz < 2.6 && gx * gx + gz * gz > .9) peca(new THREE.CylinderGeometry(.08, .08, .07, 12), "pchao", pinosChao, gx, .03, gz);

// ---------- texturas auxiliares ----------

const grad3 = (() => { const t = new THREE.DataTexture(new Uint8Array([70, 170, 255]), 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();

// ---------- os 10 estilos (bem contrastados: cada um tem que se ler num relance) ----------
const LAR = "#D0623A";
function aplica(i) {

    p.o.visible = !!st.contorno; p.o.scale.setScalar(st.esp || 1.08); if (st.contorno) p.o.material.color.set(typeof st.contorno === "function" ? st.contorno(p.papel) : st.contorno === true ? "#111111" : st.contorno); }
}
const PAL = { olho: "#141014" };
const cor = (papel, c) => papel === "olho" ? "#141014" : c[papel] ?? (papel === "pino" ? c.corpo : papel === "pchao" ? c.chao : c.corpo);
const SOPROF = new THREE.MeshBasicMaterial({ colorWrite: false });
const std = (c, o = {}) => p => new THREE.MeshStandardMaterial({ color: cor(p, c), ...o });
const ESTILOS = [

  { bg: "#f2dcc4", hemi: 1.5, key: 1.6, mat: p => new THREE.MeshStandardMaterial({ color: cor(p, { corpo: "#e0703f", chao: "#c9a27c", bola: "#6f8fe8", tronco: "#8a5a3a", copa: "#7cc47a", cubo: "#f2c14e" }), roughness: 1, bumpMap: dedos, bumpScale: 9 }) },

  { bg: "#5cc8ff", pixel: 14, mat: p => new THREE.MeshLambertMaterial({ color: cor(p, { corpo: "#ff6a1f", chao: "#3fbf3f", bola: "#ffd200", tronco: "#9b5a1e", copa: "#1e9e3a", cubo: "#e8382e" }) }) },
  // 3 giz na lousa: só traços brancos, falhados como giz
  { bg: "#1d3a2a", transp: true, soLinhas: true, linha: "#f4f4ec", contorno: "#f1f1e6", esp: 1.1, giz: true, hemi: 0, key: 0, mat: () => SOPROF },
  // 4 neon
  { bg: "#07060c", linha: p => p === "olho" ? "#ffffff" : p === "chao" ? "#00e5ff" : p === "bola" ? "#ffe14a" : p === "copa" || p === "tronco" ? "#39ff88" : p === "cubo" ? "#00e5ff" : "#ff2bd6", neon: true, hemi: .05, key: 0, esp: 1.09,
    contorno: p => p === "olho" ? "#ffffff" : p === "chao" ? "#00e5ff" : p === "bola" ? "#ffe14a" : p === "copa" || p === "tronco" ? "#39ff88" : p === "cubo" ? "#00e5ff" : "#ff2bd6",
    mat: () => new THREE.MeshBasicMaterial({ color: "#07060c" }) },
  // 5 blocos de montar: plástico brilhante com pininhos (inclusive no chão)
  { bg: "#dfe8f3", pinos: true, spec: 35, mat: p => new THREE.MeshPhysicalMaterial({ color: cor(p, { corpo: "#e3242b", chao: "#2b9e3f", bola: "#ffcd00", tronco: "#7a4a1e", copa: "#2b9e3f", cubo: "#1e63d6" }), roughness: .15, clearcoat: 1, clearcoatRoughness: .05 }) },

  { bg: "#f1e2c6", transp: true, papel: true, mat: p => new THREE.MeshBasicMaterial({ color: cor(p, { corpo: "#ef7b4a", chao: "#8cc9a0", bola: "#4f7cd6", tronco: "#a0633c", copa: "#4fa66a", cubo: "#f2c14e" }) }) },

  { bg: "#ffd84a", contorno: true, esp: 1.13, key: 2.8, mat: p => new THREE.MeshToonMaterial({ color: cor(p, { corpo: "#ff6b2c", chao: "#3ec6ff", bola: "#ff3f86", tronco: "#8b4f2a", copa: "#5ad25a", cubo: "#a05bff" }), gradientMap: grad2 }) },

// ---------- animação da MESMA cena (mascote pula e acena, bola quica, câmera gira devagar) ----------

  bracos[0].rotation.z = -(.3 + Math.sin(t * 6) * .2); bracos[1].rotation.z = 1.7 + Math.sin(t * 11) * .5;
  pernas.forEach((p, i) => p.position.y = .22 + Math.max(0, Math.sin(t * 9 + i * Math.PI)) * .08);
  olhos.forEach(o => o.scale.y = (t % 2.4) < .1 ? .15 : 1);
  bola.position.y = .26 + Math.abs(Math.sin(t * 4.2)) * .6; bola.rotation.z = -t * 3;
  const a = .3 + Math.sin(t * .5) * .35 + cam0; cam.position.set(Math.sin(a) * 5.6, 3.0, Math.cos(a) * 5.6); cam.lookAt(0, .75, 0);

const PX = document.createElement("canvas"), TMP = document.createElement("canvas"), TX = TMP.getContext("2d");

  if (st.pixel) { const pw = Math.round(w / st.pixel), ph = Math.round(h / st.pixel); R.setSize(pw, ph, false); R.render(S, cam); PX.width = pw; PX.height = ph; PX.getContext("2d").drawImage(gl, 0, 0); R.setSize(w, h, false); return { src: PX, sw: pw, sh: ph, st }; }

const grao = ctex(256, 256, (g, w, h) => { const d = g.createImageData(w, h); for (let i = 0; i < d.data.length; i += 4) { const v = 205 + rnd() * 50; d.data[i] = v; d.data[i + 1] = v * .97; d.data[i + 2] = v * .9; d.data[i + 3] = 255; } g.putImageData(d, 0, 0); }).image;
const poeira = ctex(512, 512, (g, w, h) => { g.clearRect(0, 0, w, h); for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(0,0,0,${.4 + rnd() * .6})`; g.fillRect(rnd() * w, rnd() * h, 1 + rnd() * 5, 1 + rnd() * 2); } }).image;
function desenhaJanela(i, t, x, y, w, h, raio) {

    if (st.giz) { X.fillStyle = "rgba(255,255,255,.05)"; for (let k = 0; k < 26; k++) { X.beginPath(); X.ellipse(x + ((k * 137) % w), y + ((k * 263) % h), 90, 22, k, 0, 7); X.fill(); } }

// ---------- layout ----------

}

function pilula(txt, cx, cy, fs, fundo, cor) { X.font = `700 ${fs}px SG`; const w = X.measureText(txt).width + fs * .9; X.fillStyle = fundo; X.beginPath(); X.roundRect(cx - w / 2, cy - fs * .78, w, fs * 1.56, fs * .35); X.fill(); X.fillStyle = cor; X.textAlign = "center"; X.textBaseline = "middle"; X.fillText(txt, cx, cy + 2); return w; }

window.setT = t => {
  let k = SEG.findIndex(s => t < s.fim); if (k < 0) k = SEG.length - 1;
  const s = SEG[k], lt = t - s.t0, d = s.fim - s.t0;

    const ent = eo(lin(lt, 0, .5)); titulo();
    const gw = 470, gh = 252, gx = [52, 558], gy0 = 330;
    for (let i = 0; i < 10; i++) { const x = gx[i % 2], y = gy0 + Math.floor(i / 2) * 266, sc = .85 + .15 * eo(lin(lt, i * .04, i * .04 + .4));

      desenhaJanela(i, t + i * .3, x, y, gw, gh, 22);
      X.restore(); X.font = "700 26px SG"; pilula(NOMES[i], x + 16 + X.measureText(NOMES[i]).width / 2 + 12, y + gh - 30, 26, "rgba(255,255,255,.92)", TINTA); }
    const p = eo(lin(lt, .25, .7)), cy = 980;
    X.save(); X.translate(540, cy); X.scale(.6 + .4 * p, .6 + .4 * p); X.globalAlpha = p;
    X.font = "700 92px SG"; const w1 = X.measureText("COMENTA").width + 80, w2 = X.measureText(CHAVE).width + 80, x0 = -(w1 + w2 + 20) / 2;
    X.shadowColor = "rgba(0,0,0,.35)"; X.shadowBlur = 30; pilula("COMENTA", x0 + w1 / 2, 0, 92, LARJ, "#fff"); pilula(CHAVE, x0 + w1 + 20 + w2 / 2, 0, 92, AMA, TINTA);
