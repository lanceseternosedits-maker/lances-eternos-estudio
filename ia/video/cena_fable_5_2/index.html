// ---------- camada 2D ----------
const U = document.getElementById('u'), X = U.getContext('2d');
const fnt = (s, f = 'AB') => `${f === 'SG' ? 700 : 400} ${s}px ${f}`;
const pil = (x, y, w, h, r, c) => { X.fillStyle = c; X.beginPath(); X.roundRect(x, y, w, h, r); X.fill(); };
function cabe(txt, f, mx, fam = 'AB') { while (f > 18) { X.font = fnt(f, fam); if (X.measureText(txt).width <= mx) break; f -= 2; } return f; }
function neon(txt, x, y, f, cor = '#fff', al = 'center', fam = 'AB') { X.save(); X.font = fnt(f, fam); X.textAlign = al; X.textBaseline = 'middle'; X.lineJoin = 'round';

function star(x, y, r) { X.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * .45 : r; X.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } X.closePath(); X.fill(); }
function estrelas(n, lt) { const w = 250, x = 505 - w / 2, y = 440; pil(x, y, w, 70, 35, 'rgba(58,28,40,.85)'); X.strokeStyle = '#ffb84a'; X.lineWidth = 3; X.beginPath(); X.roundRect(x, y, w, 70, 35); X.stroke();
  for (let i = 0; i < 3; i++) { const on = i < n, nov = i === n - 1, s = nov ? back(lin(lt, .05, .4)) : 1; X.save(); X.translate(x + 46 + i * 46, y + 35); X.scale(s, s); X.fillStyle = on ? '#ffd36e' : 'rgba(255,255,255,.25)'; star(0, 0, 17); X.restore(); }
  X.fillStyle = '#fff'; X.font = fnt(30, 'SG'); X.textAlign = 'left'; X.textBaseline = 'middle'; X.fillText(n + '/3', x + 170, y + 37); }
// faixa diagonal de aviso (etiqueta persistente)
function aviso(txt, sub, lt, cena) { const a = back(lin(lt, 0, .4)); X.save(); X.translate(540, 335); X.rotate(-.05); X.scale(cena === 'gancho' ? a : 1, cena === 'gancho' ? a : 1);
  const W = 1040, H = 108; X.save(); X.beginPath(); X.rect(-W / 2, -H / 2, W, H); X.clip(); X.fillStyle = '#ffc93a'; X.fillRect(-W / 2, -H / 2, W, H); X.fillStyle = '#3a1458'; for (let i = -20; i < 24; i++) { X.beginPath(); X.moveTo(-W / 2 + i * 60, -H / 2); X.lineTo(-W / 2 + i * 60 + 30, -H / 2); X.lineTo(-W / 2 + i * 60 + 70, H / 2); X.lineTo(-W / 2 + i * 60 + 40, H / 2); X.fill(); } X.restore();
  pil(-W / 2 + 30, -H / 2 + 12, W - 60, H - 24, 14, '#3a1458'); const f = cabe(txt, 46, W - 110); X.font = fnt(f); X.fillStyle = '#fff'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(txt, 0, 3); X.restore();
  if (sub) { X.save(); X.translate(540, 432); X.rotate(-.05); neon(sub, 0, 0, cabe(sub, 40, 900, 'SG'), '#ffd36e', 'center', 'SG'); X.restore(); } }
const AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
function decifra(txt, cx, y, f, k) { const L = txt.length; X.font = fnt(f); const w = X.measureText(txt).width + 60; pil(cx - w / 2, y - f * .75, w, f * 1.5, f * .3, 'rgba(58,28,40,.88)'); X.strokeStyle = '#ffb84a'; X.lineWidth = 4; X.beginPath(); X.roundRect(cx - w / 2, y - f * .75, w, f * 1.5, f * .3); X.stroke();
  let s = ''; for (let i = 0; i < L; i++) s += txt[i] === ' ' ? ' ' : (k > (i + 1) / (L + 2) ? txt[i] : AZ[(Math.floor(k * 50) * 7 + i * 13) % AZ.length]); X.fillStyle = '#fff'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(s, cx, y + 3); }
function legenda(seg, t) { const ws = seg.palavras || []; const ch = []; let cur = []; for (const w of ws) { cur.push(w); if (/[.,:?!…]$/.test(w.w) || cur.length >= 4) { ch.push(cur); cur = []; } } if (cur.length) ch.push(cur);
  let b = ch.findIndex(c => t < c[c.length - 1].t1 + .05); if (b < 0) b = ch.length - 1; const c = ch[b]; if (!c) return;
  let f = 60; X.font = fnt(f, 'SG'); const tot = () => c.reduce((a, w) => a + X.measureText(w.w + ' ').width, 0); while (tot() > 800 && f > 34) { f -= 2; X.font = fnt(f, 'SG'); }
  const W = tot(), y = 1400; faixa(y - 80, 160, .55); let x = 505 - W / 2; X.textAlign = 'left'; X.textBaseline = 'middle'; X.lineJoin = 'round';
  for (const w of c) { const on = t >= w.t0 - .03, at = on && t < w.t1 + .08; X.lineWidth = 13; X.strokeStyle = '#3a1458'; X.strokeText(w.w, x, y); X.fillStyle = at ? '#ffb84a' : on ? '#fff' : 'rgba(255,255,255,.55)'; X.fillText(w.w, x, y); x += X.measureText(w.w + ' ').width; } }
function cartao(x, y, w, h) { X.save(); X.shadowColor = 'rgba(0,0,0,.4)'; X.shadowBlur = 30; X.shadowOffsetY = 12; pil(x, y, w, h, 28, CREME); X.restore(); }
function velocimetro(v, cx, cy, r) { // medidor circular: 0 → +40%, ponteiro vai até o valor (v em 0..1 de 0..30%)
  X.save(); X.translate(cx, cy); X.lineCap = 'round'; X.lineWidth = 46; X.strokeStyle = 'rgba(58,28,40,.9)'; X.beginPath(); X.arc(0, 0, r, Math.PI, 2 * Math.PI); X.stroke();
  const a1 = Math.PI + Math.PI * (.75 * v), g = X.createLinearGradient(-r, 0, r, 0); g.addColorStop(0, '#ffe08a'); g.addColorStop(1, '#ff7a3d'); X.strokeStyle = g; X.lineWidth = 34; X.beginPath(); X.arc(0, 0, r, Math.PI, a1); X.stroke();

  n3: lt => [V(-1.2 + lt * .25, 2.6, 6 - lt * .2), V(0, 4.0, -20)],

function ik(dx, dy) { let d = Math.hypot(dx, dy); d = Math.min(d, L1 + L2 - .02); const base = Math.atan2(dy, dx), c1 = Math.acos(cl((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1)), c2 = Math.acos(cl((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1)); return [base + c1, -(Math.PI - c2)]; }
function mundo(cena, lt, d, t) {
  // corredores
