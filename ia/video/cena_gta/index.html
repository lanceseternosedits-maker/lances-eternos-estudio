mesh(new THREE.PlaneGeometry(1.8, .68), new THREE.MeshBasicMaterial({ map: lvT, transparent: true }), FRENTE, .8, 1.0, .12);

// ---------- prédio que cresce ("o mais clipado") e prédio do recorde atual, numa praça (z=-60) ----------

const m4 = new THREE.Matrix4();
// ---------- fogos (imagina) ----------

for (let i = 0; i < NF; i++) { const a = rnd() * 6.283, b = Math.acos(2 * rnd() - 1); fdir.push(V(Math.sin(b) * Math.cos(a), Math.cos(b), Math.sin(b) * Math.sin(a))); fogo.setColorAt(i, new THREE.Color([ROSA, CIANO, '#ffd36e', '#ffffff'][i % 4])); }

// ---------- camada 2D ----------
const U = document.getElementById('u'), X = U.getContext('2d');
const fnt = (s, f = 'AB') => `${f === 'SG' || f === 'FR' ? 700 : 400} ${s * (f === 'PD' ? 1.18 : 1)}px ${f}`;
const pil = (x, y, w, h, r, c) => { X.fillStyle = c; X.beginPath(); X.roundRect(x, y, w, h, r); X.fill(); };
function cabe(txt, f, mx, fam = 'AB') { while (f > 18) { X.font = fnt(f, fam); if (X.measureText(txt).width <= mx) break; f -= 2; } return f; }
function neon(txt, x, y, f, cor = '#fff', glow = ROSA, al = 'center', fam = 'PD') { X.save(); X.font = fnt(f, fam); X.textAlign = al; X.textBaseline = 'middle'; X.lineJoin = 'round';

  const g = X.createLinearGradient(0, y - f * .5, 0, y + f * .45); g.addColorStop(0, '#ffe6a0'); g.addColorStop(.5, '#ffad5c'); g.addColorStop(1, '#ff6f61');

  const x0 = al === 'center' ? x - (wp + wg + wv) / 2 : x; if (pre) neon(pre, x0, y, f, corPre, ROSA, 'left'); neon('GTA ', x0 + wp, y, f, '#fff', ROSA, 'left'); romano('VI', x0 + wp + wg, y - f * .04, f * 1.15, 'left'); }

function flap(txt, cx, y, cw, ch, k, cor = '#fff') { // letreiro split-flap: letras embaralham até assentar (k 0→1)
  const L = txt.length, AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789'; const x0 = cx - (L * (cw + 8) - 8) / 2;

  X.save(); X.shadowColor = glow; X.shadowBlur = 40; pil(cx - w / 2 - 30, y - 30, w + 60, H + 60, 30, 'rgba(58,28,40,.9)'); X.restore(); X.strokeStyle = glow; X.lineWidth = 5; X.beginPath(); X.roundRect(cx - w / 2 - 30, y - 30, w + 60, H + 60, 30); X.stroke();

  if (rot) { X.font = fnt(36, 'SG'); const tw = X.measureText(rot).width + 40; pil(cx - tw / 2, y - 100, tw, 56, 28, '#fff'); X.fillStyle = '#2a0b45'; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(rot, cx, y - 70); }
  if (sub) { X.font = fnt(30, 'SG'); const tw = X.measureText(sub).width + 40; pil(cx - tw / 2, y + H + 52, tw, 52, 26, ROSA); X.fillStyle = '#fff'; X.textAlign = 'center'; X.fillText(sub, cx, y + H + 80); } }
