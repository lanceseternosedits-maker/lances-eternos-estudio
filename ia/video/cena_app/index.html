<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:T;src:url(../cena_contagem/f/space-grotesk-latin-700-normal.woff2)}
@font-face{font-family:M;src:url(../cena_contagem/f/jetbrains-mono-latin-500-normal.woff2)}
@font-face{font-family:B;src:url(../cena_contagem/f/archivo-black-latin-400-normal.woff2)}
*{margin:0;box-sizing:border-box}html,body{width:1080px;height:1920px;overflow:hidden;background:#07050f}
#st{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:T;color:#fff;
background:radial-gradient(700px 600px at 85% 18%,#7a2cff55,transparent 70%),radial-gradient(800px 700px at 10% 70%,#00e5ff33,transparent 70%),#07050f}
#chao{position:absolute;left:-300px;right:-300px;bottom:-200px;height:900px;transform:perspective(600px) rotateX(62deg);transform-origin:bottom;
background-image:linear-gradient(#00e5ff33 2px,transparent 2px),linear-gradient(90deg,#b14cff33 2px,transparent 2px);background-size:90px 90px}
#term{position:absolute;left:70px;right:130px;top:290px;background:#0d0b1acc;border:2px solid #00e5ff66;border-radius:22px;box-shadow:0 0 40px #00e5ff33;padding:18px 26px 22px}
#term .bar{font:22px M;color:#7d7a99;margin-bottom:10px}#term .bar i{display:inline-block;width:14px;height:14px;border-radius:50%;margin-right:7px}
#cmd{font:38px/1.25 M;color:#d6fbff;white-space:pre-wrap;min-height:48px}#cmd b{color:#ff4fd8}.cur{display:inline-block;width:18px;height:38px;background:#00e5ff;vertical-align:-6px;margin-left:4px}
#holo{position:absolute;left:0;top:0;width:1080px;height:1920px}
.lin{position:absolute;height:4px;background:linear-gradient(90deg,#00e5ffcc,#b14cffcc);transform-origin:0 50%;box-shadow:0 0 12px #00e5ff}
.mod{position:absolute;width:118px;height:118px;margin:-59px 0 0 -59px;border-radius:26px;background:linear-gradient(145deg,#1b1640ee,#0f0c26ee);
border:3px solid #00e5ff;box-shadow:0 0 30px #00e5ff88,inset 0 0 25px #00e5ff33;display:grid;place-items:center;text-align:center}
.mod .e{font-size:50px;line-height:1}.mod .n{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);white-space:nowrap;font:20px T;color:#bff7ff;text-shadow:0 0 10px #00e5ff}
#nucleo{position:absolute;left:540px;top:880px;width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:44px;background:linear-gradient(145deg,#2a1d6b,#120e30);
border:4px solid #b14cff;box-shadow:0 0 60px #b14cffaa,inset 0 0 40px #b14cff55;display:grid;place-items:center;font-size:96px}
#nucleo .n{position:absolute;bottom:-48px;font:28px T;color:#e9d6ff;white-space:nowrap;text-shadow:0 0 10px #b14cff}
#chip{position:absolute;left:50%;top:455px;transform:translateX(-50%);padding:14px 34px;border-radius:99px;background:#ff3df0;color:#fff;font:44px B;letter-spacing:.02em;
box-shadow:0 0 40px #ff3df0aa;white-space:nowrap}
#pc{position:absolute;left:50%;top:1060px;transform:translateX(-50%);padding:8px 20px;border-radius:12px;background:#ffb020;color:#1a1200;font:30px B}
#masc{position:absolute;left:40px;top:1255px;width:175px;height:231px}
#leg{position:absolute;left:220px;right:140px;top:1330px;height:120px;display:grid;place-items:center;text-align:center;font:84px B;
color:#fff;-webkit-text-stroke:8px #000;paint-order:stroke fill;text-shadow:0 8px 0 #000}
#leg.hl{color:#5ff3ff}
#etq{position:absolute;left:70px;right:130px;top:470px;text-align:center}
#etq div{display:inline-block;margin:6px 0;padding:10px 26px;border-radius:16px;font:50px B}
#meio{position:absolute;left:90px;right:150px;top:470px;padding:30px;border-radius:30px;background:linear-gradient(135deg,#ff3df0,#7a2cff);text-align:center;font:46px B;box-shadow:0 0 60px #ff3df099}
#fim{position:absolute;left:90px;right:150px;top:470px;padding:26px;border-radius:30px;background:linear-gradient(135deg,#00e5ff,#7a2cff);text-align:center;font:54px B;color:#fff;box-shadow:0 0 60px #00e5ffaa}
.pt{position:absolute;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 14px #00e5ff,0 0 4px #fff;margin:-6px 0 0 -6px}
</style></head><body><div id="st"><div id="chao"></div>
<div id="term"><div class="bar"><i style="background:#ff5f56"></i><i style="background:#ffbd2e"></i><i style="background:#27c93f"></i> claude · ~/meu-app</div><div id="cmd"></div></div>
<div id="holo"></div><div id="nucleo">🧊<div class="n">SEU APP</div></div><div id="pc">💻 SÓ NO SEU PC</div><div id="chip"></div>
<div id="etq"></div><div id="meio"></div><div id="fim"></div>
<svg id="masc" viewBox="0 0 250 330"><g id="mg">
<rect x="35" y="250" width="22" height="60" rx="6" fill="#b85c38"/><rect x="80" y="250" width="22" height="60" rx="6" fill="#b85c38"/><rect x="148" y="250" width="22" height="60" rx="6" fill="#b85c38"/><rect x="193" y="250" width="22" height="60" rx="6" fill="#b85c38"/>
<rect x="15" y="70" width="220" height="190" rx="22" fill="#d97757"/>
<path d="M15 120 Q15 50 125 45 Q235 50 235 120 L235 150 L15 150Z" fill="#3b2f8f"/>
<rect x="70" y="120" width="110" height="40" rx="14" fill="#00e5ff" opacity=".85"/>
<rect x="88" y="128" width="16" height="24" rx="4" fill="#111"/><rect x="146" y="128" width="16" height="24" rx="4" fill="#111"/>
<path d="M30 105 Q125 10 220 105" stroke="#111" stroke-width="12" fill="none"/><rect x="10" y="95" width="30" height="55" rx="10" fill="#111"/><rect x="210" y="95" width="30" height="55" rx="10" fill="#111"/>
<g id="bd"><rect x="-10" y="170" width="40" height="28" rx="8" fill="#d97757"/></g><g id="be"><rect x="220" y="170" width="40" height="28" rx="8" fill="#d97757"/></g>
<rect x="60" y="200" width="130" height="40" rx="10" fill="#3b2f8f"/></g></svg>
<div id="leg"></div></div>
<script>
const M=[["p02","🖥️","SERVIDOR 24H"],["p03","🌐","DOMÍNIO"],["p04","🗄️","BANCO DE DADOS"],["p05","🪪","LOGIN"],["p06","🔐","SENHA"],["p07","📱","CÓDIGO"],
["p08","💳","PAGAMENTO"],["p09","🔔","AVISO"],["p10","✉️","E-MAIL"],["p11","🔌","OUTROS APPS"],["p12","🤖","IA"],["p13","💾","BACKUP"],["p14","👥","ESCALA"],["p15","📡","VIGIA"]];
const CX=530,CY=880,RX=355,RY=265;const pos=M.map((m,i)=>{const a=-Math.PI/2+i*2*Math.PI/M.length;return[CX+RX*Math.cos(a),CY+RY*Math.sin(a)]});
const H=document.getElementById('holo');
M.forEach((m,i)=>{const[x,y]=pos[i];const l=document.createElement('div');l.className='lin';const dx=x-CX,dy=y-CY;l.style.left=CX+'px';l.style.top=CY+'px';
l.style.width=Math.hypot(dx,dy)+'px';l.style.transform=`rotate(${Math.atan2(dy,dx)}rad)`;l.id='l'+i;H.appendChild(l);
const p=document.createElement('div');p.className='pt';p.id='p'+i;H.appendChild(p);
const d=document.createElement('div');d.className='mod';d.id='m'+i;d.style.left=x+'px';d.style.top=y+'px';d.innerHTML=`<div class="e">${m[1]}</div><div class="n">${m[2]}</div>`;H.appendChild(d)});
let TL=null;const $=id=>document.getElementById(id);
const ease=x=>x<0?0:x>1?1:1-Math.pow(1-x,3),pop=x=>{x=Math.max(0,Math.min(1,x));return x<.7?ease(x/.7)*1.12:1.12-.12*ease((x-.7)/.3)};
const KW=/^(servidor|domínio|banco|dados|login|senha|código|pagamento|pago|avisado|e-mail|apps|ia|backup|vários|vigia|caminho|like|amigo)/i;
window.setTL=t=>{TL=t};
window.setT=t=>{const S=TL.segmentos;let k=S.findIndex(s=>t>=s.t0&&t<s.t1);if(k<0)k=t<S[0].t0?0:S.length-1;const s=S[k];
 // módulos acesos: os p02..p15 cujo t0 <= t
 M.forEach((m,i)=>{const sg=S.find(x=>x.cena===m[0]);const on=sg?t-sg.t0:-1;const el=$('m'+i),ln=$('l'+i),pt=$('p'+i);
  const v=on<0?0:pop(on/0.5);el.style.opacity=on<0?0:1;el.style.transform=`scale(${v})`;ln.style.opacity=on<0?0:Math.min(1,on/0.4)*.9;
  const atual=sg&&s.cena===m[0];el.style.borderColor=atual?'#ff3df0':'#00e5ff';el.style.boxShadow=atual?'0 0 50px #ff3df0cc,inset 0 0 25px #ff3df055':'0 0 30px #00e5ff88,inset 0 0 25px #00e5ff33';
  if(on>0){const f=((t*0.6+i*0.137)%1);const[x,y]=pos[i];pt.style.opacity=1;pt.style.left=(x+(CX-x)*f)+'px';pt.style.top=(y+(CY-y)*f)+'px'}else pt.style.opacity=0});
 const nk=S.find(x=>x.cena==='p02');const pc=t<nk.t0;$('pc').style.opacity=pc?1:0;
 const g=$('nucleo');g.style.transform=`scale(${1+0.04*Math.sin(t*3)})`;g.style.borderColor=s.cena==='p01'?'#ff3df0':'#b14cff';
 // terminal digitando
 const cmd=s.terminal||'';const dt=t-s.t0;const n=Math.min(cmd.length,Math.floor(dt*28));$('term').style.opacity=cmd?1:0.0;
 $('cmd').innerHTML=cmd?`<b>›</b> ${cmd.slice(2,n+2).replace(/</g,'&lt;')}<span class="cur" style="opacity:${Math.floor(t*2.5)%2?1:0}"></span>`:'';
 // chip com nome da etapa
 const chip=$('chip');if(s.selo&&s.cena!=='p01'){chip.textContent=s.selo;chip.style.opacity=1;chip.style.transform=`translateX(-50%) scale(${pop(dt/0.4)})`}else chip.style.opacity=0;
 // etiqueta do gancho
 const e=$('etq');if(s.cena==='gancho'){const c=['#fff','#00e5ff','#ff3df0'];e.innerHTML=s.etiqueta.map((x,i)=>`<div style="background:${i?'#0d0b1a':'#fff'};color:${i?c[i]:'#07050f'};border:3px solid ${c[i]};opacity:${ease((dt-i*0.35)/0.3)};transform:translateY(${(1-ease((dt-i*0.35)/0.3))*30}px)">${x}</div>`).join('<br>');e.style.opacity=1}else e.style.opacity=0;
 const mi=$('meio');if(s.cena==='meio'){mi.innerHTML='❤️ Deixa o like<br>📲 Manda pro amigo que curte tecnologia<br><span style="color:#00ffe1">💬 Comenta CAMINHO</span>';mi.style.opacity=1;mi.style.transform=`scale(${pop(dt/0.4)})`;$('chip').style.opacity=0}else mi.style.opacity=0;
 const fi=$('fim');if(s.cena==='cta'){fi.innerHTML='💬 COMENTA CAMINHO<br><span style="font-size:34px">e receba o mapa completo na DM</span>';fi.style.opacity=1;fi.style.transform=`scale(${pop(dt/0.4)})`}else fi.style.opacity=0;
 // mascote: balança e levanta os braços quando entra módulo
 const mg=$('mg');mg.setAttribute('transform',`translate(0 ${6*Math.sin(t*4)})`);const up=Math.max(0,1-dt/0.6);
 $('bd').setAttribute('transform',`rotate(${-40*up} 10 184)`);$('be').setAttribute('transform',`rotate(${40*up} 240 184)`);
 // legenda: 1 palavra por vez
 const ws=s.palavras||[];let w=ws.find(x=>t>=x.t0&&t<x.t1)||ws.filter(x=>x.t0<=t).pop();const L=$('leg');
 L.style.opacity=(s.cena==='cta'||s.cena==='meio')&&false?0:1;L.textContent=w?w.w.replace(/[.,:;!?]+$/,''):'';L.className=w&&KW.test(w.w)?'hl':'';
 const wd=w?t-w.t0:1;L.style.transform=`scale(${pop(wd/0.18)})`;
 // câmera: leve zoom/órbita no holograma
 $('holo').style.transform=`translate(${10*Math.sin(t*.5)}px,${6*Math.cos(t*.4)}px)`;
};
</script></body></html>
