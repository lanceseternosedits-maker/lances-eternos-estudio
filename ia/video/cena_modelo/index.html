<!doctype html>
<html><head><meta charset="utf-8">
<style>

*{margin:0;padding:0;box-sizing:border-box}

#badge{position:absolute;top:290px;right:64px;background:#fff;border-radius:18px;padding:12px 22px 10px;text-align:center;box-shadow:0 14px 40px rgba(0,0,0,.45);transform:rotate(3deg)}
#badge .l{font-family:JB;font-size:22px;color:#4b4760;letter-spacing:.06em}
#badge .v{font-family:SG;font-size:56px;color:#16131f;line-height:1}
#cap{position:absolute;top:1360px;left:40px;right:40px;display:flex;justify-content:center;flex-wrap:wrap;gap:14px}
#cap span{font-family:SG;font-size:70px;color:#16131f;background:#F4EBDD;padding:6px 20px 4px;border-radius:12px;box-shadow:0 7px 0 rgba(0,0,0,.35),0 18px 40px rgba(0,0,0,.4)}
#cap span.on{background:linear-gradient(90deg,var(--c1),var(--c2));color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25)}
#bub{position:absolute;top:1120px;left:0;right:0;display:flex;justify-content:center}
#bub .in{position:relative;background:#fff;border-radius:34px;padding:26px 54px;font-family:SG;font-size:84px;color:#0a0a14;letter-spacing:-.02em;box-shadow:0 30px 80px rgba(0,0,0,.55)}
#bub .in:after{content:"";position:absolute;left:70px;bottom:-30px;border:22px solid transparent;border-top:34px solid #fff;border-bottom:0}
#bub .k{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
#brand{position:absolute;bottom:80px;left:0;right:0;display:flex;justify-content:center}

#brand .sep{width:2px;height:36px;background:#6B6590} #brand .h{font-family:IN;color:#B9B3D9;font-size:34px}
.g{background:linear-gradient(90deg,var(--c1),var(--c2));-webkit-background-clip:text;background-clip:text;color:transparent}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
</style></head>

<script type="module">

R.setSize(1080, 1920, false); R.setPixelRatio(1); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap;
R.toneMapping = THREE.ACESFilmicToneMapping; R.toneMappingExposure = 1.05; R.outputColorSpace = THREE.SRGBColorSpace;
const S = new THREE.Scene(); S.background = new THREE.Color("#0d0f2a"); S.fog = new THREE.Fog("#0d0f2a", 14, 30);

const key = new THREE.DirectionalLight(0xffe2c4, 1.6); key.position.set(5, 9, 7); key.castShadow = true; key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -8, right: 8, top: 8, bottom: -8 }); key.shadow.bias = -.0005; S.add(key);
const lamp = new THREE.PointLight(0xffb36b, 30, 9, 1.6); lamp.position.set(-3.1, 4.2, -.4); lamp.castShadow = true; S.add(lamp);
const screenLight = new THREE.PointLight(new THREE.Color(P.c1), 8, 6, 1.6); screenLight.position.set(1.4, 3.2, .2); S.add(screenLight);

const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .62, metalness: .02, flatShading: true, ...o });
const E = (c, k = 2.2) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k, roughness: .4 });
const box = (w, h, d, m, x = 0, y = 0, z = 0, par = S) => { const b = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m); b.position.set(x, y, z); b.castShadow = b.receiveShadow = true; par.add(b); return b; };
function tex(w, h, draw) { const c = document.createElement("canvas"); c.width = w; c.height = h; const g = c.getContext("2d"); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; t.draw = (...a) => { draw(g, w, h, ...a); t.needsUpdate = true; }; t.draw(); return t; }
const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

// ---------- sala ----------
box(40, .2, 30, M("#2a2040"), 0, -.1, 0);
box(40, 16, .3, M("#1c1e4a"), 0, 8, -6.2);
// janela com a cidade
const win = new THREE.Group(); win.position.set(0, 6.6, -6.0); S.add(win);
box(13, 6.4, .1, M("#0a0d2c", { emissive: "#101548", emissiveIntensity: .8 }), 0, 0, 0, win);
{ let x = -6.3; while (x < 6.3) { const bw = .6 + rnd() * .8, bh = 1.4 + rnd() * 3.8; box(bw, bh, .05, M("#121540", { emissive: "#0c0f33", emissiveIntensity: .6 }), x + bw / 2, -3.2 + bh / 2, .06, win);
  for (let yy = -3.0; yy < -3.2 + bh - .25; yy += .26) for (let xx = x + .12; xx < x + bw - .1; xx += .2) if (rnd() < .33) { const c = rnd() < .8 ? "#FFC56B" : (rnd() < .5 ? P.c1 : P.c2); const b = box(.08, .11, .02, E(c, .5 + rnd()), xx, yy, .1, win); b.castShadow = false; }
  x += bw + .05; } }
for (let x = -6.5; x <= 6.5; x += 3.25) box(.18, 6.6, .25, M("#2b2e63"), x, 0, .12, win);
box(13.2, .22, .3, M("#2b2e63"), 0, 3.25, .12, win); box(13.2, .22, .3, M("#2b2e63"), 0, -3.25, .12, win);
// mesa
const wood = M("#7a4a2e"), TOP = 2.125;
box(8.4, .25, 3.6, wood, 0, 2.0, 0);
for (const [x, z] of [[-3.9, -1.5], [3.9, -1.5], [-3.9, 1.5], [3.9, 1.5]]) box(.25, 2, .25, M("#4d2e1d"), x, 1, z);
// luminária
box(.6, .1, .6, M("#2b2e63"), -3.1, TOP + .05, -.6); box(.08, 1.6, .08, M("#2b2e63"), -3.1, TOP + .85, -.6);
const shade = new THREE.Mesh(new THREE.ConeGeometry(.5, .5, 16, 1, true), M("#FFB13B", { side: THREE.DoubleSide, emissive: "#FFB13B", emissiveIntensity: .5 })); shade.position.set(-3.1, TOP + 1.75, -.45); shade.rotation.x = -.5; S.add(shade);
// monitor com tela desenhável
const MON = new THREE.Group(); MON.position.set(1.5, TOP, -1.0); S.add(MON);
box(.7, .08, .5, M("#22243f"), 0, .04, 0, MON); box(.14, .7, .14, M("#22243f"), 0, .4, 0, MON);
box(2.7, 1.7, .12, M("#15172e"), 0, 1.45, 0, MON);
const termTex = tex(1024, 640, (g, w, h, lines = []) => {
  g.fillStyle = "#06070f"; g.fillRect(0, 0, w, h); g.fillStyle = "#14172e"; g.fillRect(0, 0, w, 60);
  ["#ff5f57", "#febc2e", "#28c840"].forEach((c, i) => { g.fillStyle = c; g.beginPath(); g.arc(36 + i * 34, 30, 11, 0, 7); g.fill(); });
  g.fillStyle = "#8f93c2"; g.font = "500 28px JB"; g.fillText("claude code", 150, 40);
  g.font = "500 44px JB"; lines.forEach((l, i) => { g.fillStyle = l.c || "#F5F3FF"; g.fillText(l.t, 40, 140 + i * 70); });
});
const scr = new THREE.Mesh(new THREE.PlaneGeometry(2.55, 1.56), new THREE.MeshBasicMaterial({ map: termTex, toneMapped: false })); scr.position.set(0, 1.45, .065); MON.add(scr);

// ---------- mascote ----------
function robot(col) {
  const g = new THREE.Group(), body = new THREE.Group(); g.add(body);
  const dark = M("#1B1F3D"), c = M(col), white = M("#ECEEFA"), scrm = M("#0A0D22", { roughness: .2 });
  const legL = box(.3, .5, .34, dark, -.24, .25, 0, body), legR = box(.3, .5, .34, dark, .24, .25, 0, body);
  box(1.0, .9, .72, c, 0, .95, 0, body); box(.42, .22, .04, E(P.c1, 1.6), 0, 1.02, .37, body);
  const head = new THREE.Group(); head.position.y = 1.86; body.add(head);
  box(1.2, .98, .92, white, 0, 0, 0, head); box(1.0, .66, .06, scrm, 0, -.02, .46, head);
  const eyes = [box(.16, .26, .04, E("#5CE1FF", 2.8), -.22, 0, .5, head), box(.16, .26, .04, E("#5CE1FF", 2.8), .22, 0, .5, head)];
  box(.06, .3, .06, dark, 0, .64, 0, head);
  const bulb = new THREE.Mesh(new THREE.SphereGeometry(.11, 12, 10), E(P.c2, 2.4)); bulb.position.y = .84; head.add(bulb);
  box(.14, .3, .3, c, -.67, 0, 0, head); box(.14, .3, .3, c, .67, 0, 0, head);
  const armL = new THREE.Group(), armR = new THREE.Group(); armL.position.set(-.64, 1.32, 0); armR.position.set(.64, 1.32, 0); body.add(armL, armR);
  box(.24, .72, .26, c, 0, -.36, 0, armL); box(.24, .72, .26, c, 0, -.36, 0, armR);
  box(.26, .18, .28, white, 0, -.78, 0, armL); box(.26, .18, .28, white, 0, -.78, 0, armR);
  return { g, body, head, eyes, armL, armR, legL, legR };
}
const bot = robot("#6C5CFF"); bot.g.scale.setScalar(.78); bot.g.position.set(-1.5, TOP, .5); S.add(bot.g);

// ---------- objetos ----------
const paperTex = tex(512, 640, (g, w, h, hi = -1) => {
  g.fillStyle = "#FBF7EE"; g.fillRect(0, 0, w, h); g.fillStyle = "#16131f"; g.font = "700 54px SG"; g.fillText("SKILL.md", 40, 84);
  g.fillStyle = "#d9d2c2"; g.fillRect(40, 108, w - 80, 4);
  const rows = [["name:", "relatorio"], ["description:", "quando usar"], ["passos:", "1 · 2 · 3"]];
  rows.forEach(([a, b], i) => { const y = 200 + i * 150;
    if (i === hi) { g.fillStyle = P.c1 + "55"; g.fillRect(24, y - 62, w - 48, 104); }
    g.fillStyle = "#6b6590"; g.font = "500 34px JB"; g.fillText(a, 44, y - 16); g.fillStyle = "#16131f"; g.font = "700 46px SG"; g.fillText(b, 44, y + 32); });
});
const paper = new THREE.Mesh(new THREE.BoxGeometry(1.0, 1.25, .02), [M("#eee"), M("#eee"), M("#eee"), M("#eee"), new THREE.MeshStandardMaterial({ map: paperTex, roughness: .8 }), M("#eee")]);
paper.castShadow = true; S.add(paper);
const glow = new THREE.Mesh(new THREE.PlaneGeometry(2.2, 2.4), new THREE.MeshBasicMaterial({ color: P.c1, transparent: true, opacity: 0, depthWrite: false, blending: THREE.AdditiveBlending,
  map: tex(256, 256, g => { const r = g.createRadialGradient(128, 128, 0, 128, 128, 128); r.addColorStop(0, "rgba(255,255,255,1)"); r.addColorStop(1, "rgba(255,255,255,0)"); g.fillStyle = r; g.fillRect(0, 0, 256, 256); }) }));
S.add(glow);
// pasta amarela
const FOLD = new THREE.Group(); FOLD.position.set(-.1, TOP, 1.0); S.add(FOLD);
box(1.5, .14, 1.1, M("#F2B531"), 0, .07, 0, FOLD); box(1.5, .5, .08, M("#E3A21F"), 0, .3, -.5, FOLD);
const lid = new THREE.Group(); lid.position.set(0, .14, -.5); FOLD.add(lid); box(1.5, .06, 1.1, M("#FFC94A"), 0, .03, .55, lid); box(.5, .07, .12, M("#FFC94A"), -.45, .03, -.02, lid);
// livros = skills
const BOOKS = [["PDF", "#FF4FD8"], ["EXCEL", "#2EE6A6"], ["RELATÓRIO", "#5CE1FF"], ["SLIDES", "#FFB13B"], ["DESIGN", "#B26BFF"]].map(([n, c], i) => {
  const t = tex(128, 512, g => { g.fillStyle = c; g.fillRect(0, 0, 128, 512); g.fillStyle = "rgba(0,0,0,.25)"; g.fillRect(0, 30, 128, 10); g.fillRect(0, 472, 128, 10);
    g.save(); g.translate(78, 256); g.rotate(-Math.PI / 2); g.fillStyle = "#16131f"; g.font = "700 46px SG"; g.textAlign = "center"; g.fillText(n, 0, 0); g.restore(); });
  const mat = M(c), side = new THREE.MeshStandardMaterial({ map: t, roughness: .6 });
  const b = new THREE.Mesh(new THREE.BoxGeometry(.28, 1.05, .8), [mat, mat, M("#FBF7EE"), mat, side, mat]); b.castShadow = true;
  b.rotation.y = Math.PI / 2; const home = new THREE.Vector3(2.0 + i * .36, TOP + .525, 1.0); b.position.copy(home); b.userData = { home, c }; S.add(b); return b;
});
// balão de pedido
const askTex = tex(768, 220, g => { g.fillStyle = "#fff"; g.beginPath(); g.roundRect(0, 0, 768, 180, 40); g.fill(); g.beginPath(); g.moveTo(90, 178); g.lineTo(150, 178); g.lineTo(70, 220); g.fill();
  g.fillStyle = "#16131f"; g.font = "700 60px SG"; g.fillText("faz o relatório da semana", 40, 110); });
const ask = new THREE.Mesh(new THREE.PlaneGeometry(2.6, .75), new THREE.MeshBasicMaterial({ map: askTex, transparent: true, toneMapped: false })); ask.position.set(-.2, TOP + 2.9, .6); S.add(ask);
// letras de voxel "SKILL"
const FONT = { S: ["01111", "10000", "10000", "01110", "00001", "00001", "11110"], K: ["10001", "10010", "10100", "11000", "10100", "10010", "10001"], I: ["111", "010", "010", "010", "010", "010", "111"], L: ["1000", "1000", "1000", "1000", "1000", "1000", "1111"] };
const letters = []; { let x0 = -2.64; const sz = .22; const cols = [P.c1, P.c2, "#FFB13B", "#2EE6A6", "#B26BFF"];
  "SKILL".split("").forEach((ch, li) => { const f = FONT[ch]; f.forEach((row, r) => [...row].forEach((v, c) => { if (v === "1") {
    const b = box(sz * .94, sz * .94, sz * .94, M(cols[li], { emissive: cols[li], emissiveIntensity: .35 }), 0, 0, 0); const home = new THREE.Vector3(x0 + c * sz, TOP + 4.6 - r * sz, -1.6);
    b.userData = { home, d: rnd() * .7 + li * .12 }; letters.push(b); } })); x0 += (f[0].length + 1) * sz; }); }
// engrenagens
function gear(r, n, c) { const g = new THREE.Group(); const m = M(c, { metalness: .4, roughness: .4 });
  const d = new THREE.Mesh(new THREE.CylinderGeometry(r, r, .16, 24), m); d.rotation.x = Math.PI / 2; d.castShadow = true; g.add(d);
  for (let i = 0; i < n; i++) { const a = i / n * Math.PI * 2; const t = box(.16, .2, .16, m, Math.cos(a) * (r + .07), Math.sin(a) * (r + .07), 0, g); t.rotation.z = a; }
  const hole = new THREE.Mesh(new THREE.CylinderGeometry(r * .3, r * .3, .18, 12), M("#16131f")); hole.rotation.x = Math.PI / 2; g.add(hole); S.add(g); return g; }
const gears = [gear(.42, 10, "#FFB13B"), gear(.3, 8, P.c1), gear(.26, 7, P.c2)];
const gearHome = [[-.35, 1.25, 1.0], [.35, .95, 1.0], [.15, 1.65, 1.0]];
// projetos
const projs = [0, 1, 2].map(i => { const g = new THREE.Group(); S.add(g);
  const t = tex(512, 340, (gg, w, h) => { gg.fillStyle = "#11142f"; gg.fillRect(0, 0, w, h); gg.fillStyle = "#1d2150"; gg.fillRect(0, 0, w, 56); gg.fillStyle = "#b9b3d9"; gg.font = "500 30px JB"; gg.fillText(`projeto-${i + 1}/`, 24, 38);
    gg.fillStyle = "#2a2f63"; for (let k = 0; k < 4; k++) gg.fillRect(30, 90 + k * 52, 280 + (k * 70 % 160), 20); });
  const p = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.0, .06), [M("#2b2e63"), M("#2b2e63"), M("#2b2e63"), M("#2b2e63"), new THREE.MeshBasicMaterial({ map: t, toneMapped: false }), M("#2b2e63")]); g.add(p);
  const chk = new THREE.Group(); chk.position.set(.5, -.25, .1); g.add(chk);
  const a = box(.1, .26, .08, E("#53F29B", 2.6), -.09, -.03, 0, chk); a.rotation.z = .75; const b = box(.1, .5, .08, E("#53F29B", 2.6), .08, .06, 0, chk); b.rotation.z = -.62;
  const bk = box(.16, .5, .4, M(BOOKS[2].userData.c), 0, 0, 0); bk.castShadow = false;
  g.position.set((i - 1) * 1.55, TOP + 2.9 + (i === 1 ? .3 : 0), -.2); g.rotation.y = -(i - 1) * .25; return { g, chk, bk };
});
// cubos de festa
const confetti = []; for (let i = 0; i < 46; i++) { const c = [P.c1, P.c2, "#FFB13B", "#2EE6A6", "#B26BFF"][i % 5]; const b = box(.22, .22, .22, M(c), 0, -5, 0);
  b.userData = { x: -3.8 + rnd() * 7.6, z: -1.2 + rnd() * 2.6, d: rnd() * 1.2, r: rnd() * 6 }; confetti.push(b); }

// ---------- tempo ----------
const cl = x => Math.max(0, Math.min(1, x));
const ease = x => 1 - Math.pow(1 - cl(x), 3), eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const back = x => { x = cl(x); const c = 1.9; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const bounce = x => { x = cl(x); const n = 7.5625, d = 2.75; if (x < 1 / d) return n * x * x; if (x < 2 / d) return n * (x -= 1.5 / d) * x + .75; if (x < 2.5 / d) return n * (x -= 2.25 / d) * x + .9375; return n * (x -= 2.625 / d) * x + .984375; };
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const SHOT = {
  hook: [V(-.6, 3.8, 6.4), V(-1.0, 3.35, .6)], nome: [V(0, 5.4, 12.8), V(0, 5.0, -1.6)], pasta: [V(.2, 4.4, 6.2), V(-.1, 3.1, 1.0)],
  escolhe: [V(.35, 4.6, 10.8), V(.25, 3.6, .5)], scripts: [V(-.1, 4.3, 6.8), V(-.1, 3.5, 1.0)], projetos: [V(-.2, 4.8, 9.6), V(-.2, 4.1, -.2)],
  comando: [V(1.5, 3.65, 5.8), V(1.5, 3.5, -1.0)], cta: [V(0, 4.4, 11), V(0, 3.3, 0)],
};
const segAt = t => { let k = 0; SEG.forEach((s, j) => { if (t >= s.t0 - .04) k = j; }); return k; };
const $ = id => document.getElementById(id);
let lastTerm = "";

window.setT = function (t) {
  const k = segAt(t), s = SEG[k], q = t - s.t0, prev = SEG[Math.max(0, k - 1)];
  // câmera: corte rápido com "whip" de 0,45 s + deriva contínua
  // corte seco: cada cena começa um pouco mais longe e chega em 0,45 s (entra já em movimento), depois deriva devagar
  const [pB, lB] = SHOT[s.cena], p = pB.clone(), l = lB.clone(), dir = p.clone().sub(l).normalize();
  const qq = Math.max(0, q + .04), punch = 1 - ease(qq / .45);
  p.addScaledVector(dir, punch * (k === 0 ? 2.5 : 1.1) - qq * .1);
  p.x += Math.sin(t * .7) * .12; p.y += Math.sin(t * .5) * .06;
  cam.position.copy(p); cam.lookAt(l);
  lamp.intensity = 30 + Math.sin(t * 13) * .6;
  const sc = s.cena;
  // mascote
  const b = bot; b.g.position.y = TOP; b.armL.rotation.set(0, 0, 0); b.armR.rotation.set(0, 0, 0); b.g.rotation.y = .25;
