<script type="module">
// Referência 15 (@clubedasskills, "O problema dos tokens", 10/11): oficina 3D ao entardecer com o tanque de TOKENS, arquivo de pastas,
// o mapa (grafo) que se forma no ar, dois personagens em diálogo (o mascote laranja e o colega menta de boné, nosso),
// faixa de papel no topo com o título de cada fala, balões de pergunta, contador de tokens, selo GRÁTIS, odômetro 71x e comenta MAPA.
// Interface igual à cena_gta: setTL, setT, eventos, capa. Render: CENA=cena_tokens/index.html node cena_quarto/render_quarto.js
import * as THREE from '../cena_trend/three.module.min.js';
for (const f of ['400 60px AB', '700 60px SG', '700 60px FR']) await document.fonts.load(f);
const R = new THREE.WebGLRenderer({ canvas: document.getElementById('g'), antialias: true, preserveDrawingBuffer: true });
R.setSize(1080, 1920, false); R.shadowMap.enabled = true; R.shadowMap.type = THREE.PCFSoftShadowMap; R.outputColorSpace = THREE.SRGBColorSpace;
const S = new THREE.Scene(); const cam = new THREE.PerspectiveCamera(42, 1080 / 1920, .1, 300);
S.fog = new THREE.Fog(0x2a1d3a, 30, 90);
const hemi = new THREE.HemisphereLight(0xffd9b8, 0x2a1d3a, 1.0); S.add(hemi);
const sol = new THREE.DirectionalLight(0xffa86a, 2.2); sol.position.set(-6, 9, -14); sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048); sol.shadow.bias = -0.0006; sol.shadow.normalBias = .04;
Object.assign(sol.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20, near: 1, far: 60 }); S.add(sol, sol.target);
const frente = new THREE.PointLight(0xffd7a8, 18, 30, 1.6); frente.position.set(2, 6, 9); S.add(frente);
const cl = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x)), lin = (t, a, b) => cl((t - a) / (b - a)), eo = x => 1 - Math.pow(1 - cl(x), 3);
const eio = x => { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }, back = x => { x = cl(x); const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
let sd = 5; const rnd = () => (sd = (sd * 16807) % 2147483647) / 2147483647;
const M = (c, o = {}) => new THREE.MeshStandardMaterial({ color: c, roughness: .7, ...o }), E = (c, k = 2) => new THREE.MeshStandardMaterial({ color: c, emissive: c, emissiveIntensity: k, roughness: .4 });
function mesh(g, m, par = S, x = 0, y = 0, z = 0) { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; par.add(o); return o; }
const box = (w, h, d, m, par, x, y, z) => mesh(new THREE.BoxGeometry(w, h, d), m, par, x, y, z);
function ctex(w, h, draw) { const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.draw = (...a) => { g.clearRect(0, 0, w, h); draw(g, w, h, ...a); t.needsUpdate = true; }; t.draw(); return t; }
const V = (x, y, z) => new THREE.Vector3(x, y, z);
const LAR = '#ff8a3d', CORAL = '#ff6f61', MENTA = '#3fd6a6', TINTA = '#2b1838', CREME = '#fff4e2', OURO = '#ffc84a';

// ---------- sala: piso de madeira, parede do fundo com janelão ao entardecer, varal de luzinhas ----------
const pisoT = ctex(512, 512, g => { for (let i = 0; i < 8; i++) { g.fillStyle = i % 2 ? '#8a5a3c' : '#7a4e34'; g.fillRect(0, i * 64, 512, 64); g.fillStyle = 'rgba(0,0,0,.18)'; g.fillRect(0, i * 64, 512, 2); } });
pisoT.wrapS = pisoT.wrapT = THREE.RepeatWrapping; pisoT.repeat.set(6, 6);
const piso = mesh(new THREE.PlaneGeometry(60, 60), M('#ffffff', { map: pisoT, roughness: .6 })); piso.rotation.x = -Math.PI / 2;
const ceuT = ctex(64, 512, g => { const d = g.createLinearGradient(0, 0, 0, 512); d.addColorStop(0, '#3f4cb8'); d.addColorStop(.45, '#a65ab4'); d.addColorStop(.75, '#ff7f8a'); d.addColorStop(1, '#ffc070'); g.fillStyle = d; g.fillRect(0, 0, 64, 512); });
S.background = new THREE.Color('#2a1d3a');
box(40, 14, .4, M('#4a3248'), S, 0, 7, -10);
const jan = mesh(new THREE.PlaneGeometry(22, 9), new THREE.MeshBasicMaterial({ map: ceuT, fog: false }), S, 0, 7, -9.7); jan.castShadow = false;
const solT = ctex(256, 256, g => { const h = g.createRadialGradient(128, 128, 20, 128, 128, 128); h.addColorStop(0, 'rgba(255,246,214,1)'); h.addColorStop(.45, 'rgba(255,200,130,1)'); h.addColorStop(.5, 'rgba(255,180,120,.4)'); h.addColorStop(1, 'rgba(255,160,110,0)'); g.fillStyle = h; g.fillRect(0, 0, 256, 256); });
mesh(new THREE.PlaneGeometry(7, 7), new THREE.MeshBasicMaterial({ map: solT, transparent: true, fog: false, depthWrite: false }), S, -4, 4.6, -9.65).castShadow = false;
for (let i = 0; i < 5; i++) box(.25, 9, .3, M('#2b1838'), S, -11 + i * 5.5, 7, -9.6); box(22.4, .3, .3, M('#2b1838'), S, 0, 11.6, -9.6); box(22.4, .3, .3, M('#2b1838'), S, 0, 2.5, -9.6);
// silhuetas de prédios na janela
for (let i = 0; i < 14; i++) { const h = 1 + rnd() * 3; const p = mesh(new THREE.PlaneGeometry(1.2 + rnd(), h), new THREE.MeshBasicMaterial({ color: '#5a3a6a', fog: false }), S, -10 + i * 1.5, 2.5 + h / 2, -9.68); p.castShadow = false; }
const NL = 40, luzes = new THREE.InstancedMesh(new THREE.SphereGeometry(.09, 8, 8), new THREE.MeshBasicMaterial({ color: '#ffd9a0', fog: false }), NL); S.add(luzes);
const m4 = new THREE.Matrix4(); for (let i = 0; i < NL; i++) { const x = -12 + i * .62; m4.makeTranslation(x, 12.4 - Math.sin(i / NL * Math.PI) * 1.4 - (i % 2) * .05, -8.8); luzes.setMatrixAt(i, m4); }

// ---------- tanque de TOKENS (centro-esquerda) ----------
const TQ = new THREE.Group(); TQ.position.set(-2.6, 0, -2); S.add(TQ);
mesh(new THREE.CylinderGeometry(1.25, 1.35, .4, 32), M('#3a2a3a', { metalness: .6, roughness: .3 }), TQ, 0, .2, 0);
mesh(new THREE.CylinderGeometry(1.25, 1.25, .3, 32), M('#3a2a3a', { metalness: .6, roughness: .3 }), TQ, 0, 4.75, 0);
const vidro = mesh(new THREE.CylinderGeometry(1.1, 1.1, 4.2, 32, 1, true), new THREE.MeshPhysicalMaterial({ color: '#ffffff', transparent: true, opacity: .18, roughness: .05, metalness: 0, side: THREE.DoubleSide }), TQ, 0, 2.5, 0); vidro.castShadow = false;
const liqM = new THREE.MeshStandardMaterial({ color: MENTA, emissive: MENTA, emissiveIntensity: .7, transparent: true, opacity: .85 }); const LIQ = mesh(new THREE.CylinderGeometry(1.0, 1.0, 1, 32), liqM, TQ, 0, .9, 0); LIQ.castShadow = false;
const rotT = ctex(512, 160, (g, w, h, pct = 67) => { g.fillStyle = '#2b1838'; g.beginPath(); g.roundRect(0, 0, w, h, 24); g.fill(); g.fillStyle = '#fff'; g.font = '400 54px AB'; g.textAlign = 'center'; g.fillText('TOKENS', w / 2, 62); g.fillStyle = pct < 20 ? '#ff6f61' : '#3fd6a6'; g.font = '400 70px AB'; g.fillText(pct + '%', w / 2, 140); });
const ROT = mesh(new THREE.PlaneGeometry(2.2, .69), new THREE.MeshBasicMaterial({ map: rotT }), TQ, 0, 5.4, .2); ROT.castShadow = false;
function nivel(p) { LIQ.scale.y = Math.max(.02, 4 * p); LIQ.position.y = .45 + 2 * p; liqM.color.set(p < .2 ? CORAL : MENTA); liqM.emissive.set(p < .2 ? CORAL : MENTA); rotT.draw(Math.round(p * 100)); }

// ---------- arquivo de pastas (direita) ----------
const ARQ = new THREE.Group(); ARQ.position.set(4.2, 0, -3); S.add(ARQ); const gavetas = [];
for (let c = 0; c < 3; c++) { const g = new THREE.Group(); g.position.set((c - 1) * 1.6, 0, 0); ARQ.add(g); box(1.5, 3.6, 1.4, M('#c9b8a6', { metalness: .3, roughness: .5 }), g, 0, 1.8, 0);
  for (let i = 0; i < 4; i++) { const gv = box(1.3, .74, .1, M('#e8dccb', { metalness: .2 }), g, 0, .55 + i * .85, .72); box(.4, .08, .06, M('#5a4a4a'), gv, 0, .18, .06); gavetas.push(gv); } }
// folhas voando (arquivos lidos)
const NF = 18, FOL = []; for (let i = 0; i < NF; i++) { const f = mesh(new THREE.PlaneGeometry(.5, .66), new THREE.MeshStandardMaterial({ color: '#fffaf0', side: THREE.DoubleSide }), S, 0, -5, 0); f.castShadow = false; FOL.push(f); }

// ---------- mapa (grafo) no ar ----------
const MAPA = new THREE.Group(); MAPA.position.set(.6, 6.2, -3); S.add(MAPA); const nos = [], arestas = [];
for (let i = 0; i < 42; i++) { const r = 1.2 + rnd() * 3.2, a = rnd() * 6.283, b = (rnd() - .5) * 1.6; const p = V(Math.cos(a) * r, b * 1.8, Math.sin(a) * r * .6);
  const big = i < 6; const n = mesh(new THREE.SphereGeometry(big ? .26 : .14, 16, 16), E(big ? LAR : ['#ffd36e', MENTA, '#ff9ad1'][i % 3], big ? 1.2 : .9), MAPA, p.x, p.y, p.z); n.castShadow = false; n.userData.p = p; nos.push(n); }
const lmat = new THREE.LineBasicMaterial({ color: '#ffe6c0', transparent: true, opacity: .75 });
for (let i = 6; i < 42; i++) { const j = i % 6; const g = new THREE.BufferGeometry().setFromPoints([nos[i].userData.p, nos[j].userData.p]); const l = new THREE.Line(g, lmat); MAPA.add(l); arestas.push(l);
  if (i % 3 === 0) { const k = 6 + ((i * 7) % 36); const g2 = new THREE.BufferGeometry().setFromPoints([nos[i].userData.p, nos[k].userData.p]); const l2 = new THREE.Line(g2, lmat); MAPA.add(l2); arestas.push(l2); } }

// ---------- personagens ----------
function mascote(cor, esc = 1) { const g = new THREE.Group(); const c = M(cor, { roughness: .55 }); const corpo = box(1.6, 1.05, .9, c, g, 0, 1.0, 0); for (const x of [-.95, .95]) box(.32, .32, .4, c, g, x, 1.0, 0);
  const olhos = []; for (const x of [-.32, .32]) olhos.push(box(.13, .3, .05, M('#111'), g, x, 1.1, .46)); for (let i = 0; i < 4; i++) box(.16, .4, .16, c, g, -.55 + i * .37, .25, 0); g.scale.setScalar(esc); g.userData.olhos = olhos; g.userData.alto = 1.6 * esc; S.add(g); return g; }
const A = mascote('#d9774a', 1.15); A.position.set(-.2, 0, 1.4);
const B = mascote(MENTA, 1.0); B.position.set(2.4, 0, 1.0); B.rotation.y = -.35;
// boné do colega (nosso, não copia o personagem da referência)
box(1.2, .22, 1.0, M('#2b5cff'), B, 0, 1.64, 0); box(1.0, .06, .6, M('#2b5cff'), B, 0, 1.55, .7);

// ---------- camada 2D ----------
const U = document.getElementById('u'), X = U.getContext('2d');
const fnt = (s, f = 'AB') => `${f === 'AB' ? 400 : 700} ${s}px ${f}`;
const pil = (x, y, w, h, r, c) => { X.fillStyle = c; X.beginPath(); X.roundRect(x, y, w, h, r); X.fill(); };
function cabe(txt, f, mx, fam = 'AB') { while (f > 18) { X.font = fnt(f, fam); if (X.measureText(txt).width <= mx) break; f -= 2; } return f; }
function titulo(t, f, cor = '#fff', x = 540, y = 960, al = 'center', fam = 'AB') { X.save(); X.font = fnt(f, fam); X.textAlign = al; X.textBaseline = 'middle'; X.lineJoin = 'round';
  X.shadowColor = 'rgba(20,8,30,.5)'; X.shadowBlur = f * .1; X.shadowOffsetY = f * .06; X.lineWidth = f * .16; X.strokeStyle = TINTA; X.strokeText(t, x, y); X.shadowColor = 'transparent'; X.fillStyle = cor; X.fillText(t, x, y); X.restore(); }
// faixa de papel no topo (título da fala): parte normal em AB, parte destacada em Fraunces itálico coral
function faixa(a, b, lt) { const k = eo(lin(lt, 0, .3)); X.save(); X.globalAlpha = k; X.translate(540, 330); X.rotate(-.012);
  X.font = fnt(50); const wa = X.measureText(a + ' ').width; X.font = 'italic 700 54px FR'; const wb = X.measureText(b).width; const W = Math.min(900, wa + wb + 80);
  X.fillStyle = CREME; X.shadowColor = 'rgba(0,0,0,.35)'; X.shadowBlur = 18; X.shadowOffsetY = 8; X.beginPath(); X.moveTo(-W / 2, -48); for (let x = -W / 2; x <= W / 2; x += 30) X.lineTo(x, -48 + (Math.floor(x / 30) % 2) * 4); X.lineTo(W / 2, 48); for (let x = W / 2; x >= -W / 2; x -= 30) X.lineTo(x, 48 - (Math.floor(x / 30) % 2) * 4); X.closePath(); X.fill(); X.shadowColor = 'transparent';
  X.fillStyle = 'rgba(255,214,120,.75)'; X.fillRect(-W / 2 - 20, -60, 90, 34); X.fillRect(W / 2 - 70, 26, 90, 34);
  X.textBaseline = 'middle'; X.textAlign = 'left'; const x0 = -(wa + wb) / 2; X.fillStyle = TINTA; X.font = fnt(50); X.fillText(a + ' ', x0, 4); X.fillStyle = CORAL; X.font = 'italic 700 54px FR'; X.fillText(b, x0 + wa, 2); X.restore(); }
const pv = new THREE.Vector3();
function balao(obj, txt, lt, lado = 1) { obj.getWorldPosition(pv); pv.y += obj.userData.alto + .3; pv.project(cam); if (pv.z > 1) return; let x = cl((pv.x * .5 + .5) * 1080 + lado * 120, 220, 860), y = cl((-pv.y * .5 + .5) * 1920 - 120, 480, 1200);
  const s = back(lin(lt, 0, .3)); X.save(); X.translate(x, y); X.scale(s, s); X.font = fnt(cabe(txt, 60, 460)); const w = X.measureText(txt).width + 70, h = 120;
  X.fillStyle = '#fff'; X.strokeStyle = TINTA; X.lineWidth = 8; X.beginPath(); X.roundRect(-w / 2, -h / 2, w, h, 30); X.fill(); X.stroke(); X.beginPath(); X.moveTo(-lado * 40, h / 2 - 4); X.lineTo(-lado * 90, h / 2 + 50); X.lineTo(-lado * 5, h / 2 - 4); X.closePath(); X.fill(); X.stroke(); X.fillStyle = '#fff'; X.fillRect(-lado * 60 - 20, h / 2 - 12, 50, 12);
  X.fillStyle = TINTA; X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(txt, 0, 4); X.restore(); }
function contador(n, rot, x = 540, y = 600) { const s = n.toLocaleString('pt-BR'); X.save(); X.font = fnt(96); const w = Math.max(X.measureText(s).width + 80, 360); pil(x - w / 2, y - 60, w, 150, 26, 'rgba(43,24,56,.92)'); X.strokeStyle = OURO; X.lineWidth = 5; X.beginPath(); X.roundRect(x - w / 2, y - 60, w, 150, 26); X.stroke();
  X.fillStyle = OURO; X.font = fnt(30, 'SG'); X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(rot, x, y - 28); X.fillStyle = '#fff'; X.font = fnt(84); X.fillText(s, x, y + 40); X.restore(); }
function selo(txt, x, y, r, lt) { const s = back(lin(lt, 0, .35)); X.save(); X.translate(x, y); X.rotate(-.18 + Math.sin(lt * 2) * .03); X.scale(s, s); X.fillStyle = OURO; X.beginPath(); for (let i = 0; i < 32; i++) { const a = i / 32 * 6.283, rr = i % 2 ? r * .9 : r; X.lineTo(Math.cos(a) * rr, Math.sin(a) * rr); } X.closePath(); X.fill();
  X.strokeStyle = TINTA; X.lineWidth = 6; X.stroke(); X.fillStyle = TINTA; X.font = fnt(r * .36); X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(txt, 0, 4); X.restore(); }
function flap(txt, cx, y, cw, ch, k) { const L = txt.length, AZ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'; const x0 = cx - (L * (cw + 8) - 8) / 2;
  for (let i = 0; i < L; i++) { const ok = k > (i + 1) / (L + 2); const c = ok ? txt[i] : AZ[(Math.floor(k * 60) * 7 + i * 13) % AZ.length]; const x = x0 + i * (cw + 8); pil(x, y, cw, ch, 10, TINTA); X.fillStyle = 'rgba(255,255,255,.1)'; X.fillRect(x, y + ch / 2 - 1, cw, 2);
    X.fillStyle = ok ? OURO : '#fff'; X.font = fnt(ch * .6); X.textAlign = 'center'; X.textBaseline = 'middle'; X.fillText(c, x + cw / 2, y + ch / 2 + 3); } }
function cartao(x, y, w, h) { X.save(); X.shadowColor = 'rgba(0,0,0,.4)'; X.shadowBlur = 30; X.shadowOffsetY = 12; pil(x, y, w, h, 26, CREME); X.restore(); }
function legenda(seg, t) { const ws = seg.palavras || []; const ch = []; let cur = []; for (const w of ws) { cur.push(w); if (/[.,:?!…]$/.test(w.w) || cur.length >= 3) { ch.push(cur); cur = []; } } if (cur.length) ch.push(cur);
  let b = ch.findIndex(c => t < c[c.length - 1].t1 + .05); if (b < 0) b = ch.length - 1; const c = ch[b]; if (!c) return;
  let f = 58; X.font = fnt(f); const tot = () => c.reduce((a, w) => a + X.measureText(w.w + ' ').width, 0); while (tot() > 820 && f > 34) { f -= 2; X.font = fnt(f); }
  const W = tot(), y = 1400; let x = 540 - W / 2; X.textAlign = 'left'; X.textBaseline = 'middle'; X.lineJoin = 'round';
  for (const w of c) { const on = t >= w.t0 - .03, at = on && t < w.t1 + .08; const ww = X.measureText(w.w).width; if (at) { pil(x - 10, y - f * .62, ww + 20, f * 1.24, 10, OURO); } X.lineWidth = 11; X.strokeStyle = TINTA; if (!at) X.strokeText(w.w, x, y); X.fillStyle = at ? TINTA : on ? '#fff' : 'rgba(255,255,255,.6)'; X.fillText(w.w, x, y); x += X.measureText(w.w + ' ').width; } }

// ---------- cenas ----------
const FAIXA = { gancho: ['o problema dos', 'tokens'], plano: ['US$ 20 ·', 'acaba em 2 dias'], problema: ['uma ferramenta', 'grátis'], porque: ['por que', 'acaba?'], sessao: ['a cada', 'sessão nova'],
  le: ['abre, lê,', 'gasta'], solucao: ['qual é a', 'solução?'], graphify: ['grátis e', 'código aberto'], mapa: ['roda uma vez,', 'vira um mapa'], meucodigo: ['um mapa', 'do meu código?'],
  exato: ['cada arquivo,', 'cada ligação'], proxima: ['na próxima', 'sessão'], quanto: ['quanto', 'economiza?'], economia: ['maior o projeto,', 'mais economia'], para: ['não paga', 'duas vezes'], cta: ['comenta', 'MAPA'] };
const SHOT = {
  gancho: lt => [V(-.6 + lt * .15, 3.8, 12 - lt * .3), V(-.6, 2.7, -1)],
  plano: lt => [V(1.2 + lt * .1, 3, 9.5), V(1.4, 1.9, 0)],
  problema: lt => [V(-.8, 4.4, 11 - lt * .25), V(-2.2, 3.2, -2)],
  porque: lt => [V(1.6, 3, 9.2), V(1.4, 1.9, 0)],
  sessao: lt => [V(1.8 + lt * .3, 3.6, 8.5), V(3.8, 2, -2.6)],
  le: lt => [V(4.8 - lt * .3, 3, 6.5), V(3.8, 1.9, -2.4)],
  solucao: lt => [V(1.4, 3, 9.2), V(1.4, 1.9, 0)],
  graphify: lt => [V(0, 4.4, 11.5 - lt * .3), V(0, 3.4, -1)],
  mapa: lt => [V(Math.sin(lt * .25) * 3, 6.5, 9.5 - lt * .2), V(.6, 6, -3)],
  meucodigo: lt => [V(1.8, 3.2, 9.2), V(1.4, 2.1, 0)],
  exato: lt => [V(-2 + lt * .5, 6.8, 6.5), V(.6, 6.2, -3)],
  proxima: lt => [V(-.6, 3.8, 10.5), V(-.8, 2.7, -1.5)],
  quanto: lt => [V(1.2, 3, 9.2), V(1.4, 1.9, 0)],
  economia: lt => [V(0, 7.5 + lt * .2, 11), V(.6, 5.5, -3)],
  para: lt => [V(-.2, 3.2, 9.5 - lt * .2), V(.8, 2, 0)],
  cta: lt => [V(.6, 3.6, 11), V(.6, 2.8, -1)],
};
let TL = null; window.setTL = t => { TL = t; };
window.eventos = () => { const ev = []; TL.segmentos.forEach((s, i) => { if (i) ev.push({ t: s.t0, som: s.quem === 'B' ? 'pop' : 'whoosh' });
  if (s.cena === 'graphify') ev.push({ t: s.t0 + .2, som: 'stamp' }); if (s.cena === 'le' || s.cena === 'sessao') ev.push({ t: s.t0 + .3, som: 'paper' }); if (s.cena === 'mapa') ev.push({ t: s.t0 + .2, som: 'riser' });
  if (s.cena === 'economia') ev.push({ t: s.t0 + .3, som: 'clock', dur: 1.4 }); if (s.cena === 'cta') ev.push({ t: s.t0 + .3, som: 'typing', dur: 1.0 }); if (s.cena === 'proxima') ev.push({ t: s.t0 + .4, som: 'ding' }); });
  ev.push({ t: TL.total - .6, som: 'whoosh' }); return ev; };

const ORDEM = Object.keys(SHOT);
function mundo(cena, lt, d, t) {
