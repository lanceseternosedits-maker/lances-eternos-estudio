# Copiar para .github/workflows/teste-hibrido.yml
name: Teste hibrido (Gemini + codigo)
on:
  workflow_dispatch:
    inputs:
      mock:
        description: "Rodar sem gerar no Gemini (custo zero)"
        type: boolean
        default: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg fonts-inter fonts-dejavu-core
          pip install pillow numpy
      - name: Gerar cenarios e personagens (Gemini)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python hibrido/gerar.py hibrido/roteiro.json hibrido/assets ${{ inputs.mock && '--mock' || '' }}
      - name: Compor o video
        run: python hibrido/compor.py hibrido/roteiro.json hibrido/assets teste-hibrido.mp4
      - uses: actions/upload-artifact@v4
        with:
          name: teste-hibrido
          path: |
            teste-hibrido.mp4
            hibrido/assets/
